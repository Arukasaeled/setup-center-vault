name: Validate and Publish Vault Release

on:
  push:
    branches:
      - main
    paths:
      - "releases/latest.json"
      - "manifest.json"
      - "resources/**"
      - "styles/**"
      - "patterns/**"
      - "templates/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Force create release tag if absent (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  validate-content:
    name: Validate Content Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20

      - name: Validate Vault Content Integrity (Zero Dead Content)
        run: node scripts/validate.mjs --content-only

  publish-and-tag:
    name: Tag & Verify Immutable Release
    needs: validate-content
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20

      - name: Verify Version Consistency & Co-originated Tag
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('releases/latest.json')).releaseVersion)")
          TAG="v$VERSION"
          COMMIT_SHA=$(git rev-parse HEAD)
          PIN_SHA=$(node -e "console.log(JSON.parse(require('fs').readFileSync('releases/latest.json')).commitSha)")

          echo "Target Release Version: $VERSION"
          echo "Target Release Tag:     $TAG"
          echo "Head Commit SHA:        $COMMIT_SHA"
          echo "Pinned Commit SHA:      $PIN_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Create and push tag if absent
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag $TAG on HEAD..."
            git tag -a "$TAG" -m "Vault Release $VERSION" "$COMMIT_SHA"
            git push origin "$TAG"
            echo "Successfully pushed tag $TAG"
          else
            echo "Tag $TAG already exists."
          fi

          # 2. Strict checkpoint validation ensuring tag & commit are co-originated (Issues D01, D02)
          node scripts/validate.mjs --checkpoint-only
